[project]
name = "ygo-collection-manager"
version = "0.8.0"
description = "Local manager, browser, analyser and valuer for a Yu-Gi-Oh card collection"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    # Required by DuckDB to register the fold() Python UDF, which keeps the
    # NFKD folding to a single implementation shared by SQL and Python.
    "numpy>=2.0",
    # DuckDB needs pytz to return a TIMESTAMP WITH TIME ZONE to Python, which is
    # how created_at/updated_at are typed.
    "python-multipart>=0.0.32",
    "pytz>=2024.1",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
ygo-explorer = "ygo_explorer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ygo_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
